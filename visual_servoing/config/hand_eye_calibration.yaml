# 文件作用：配置 A3、30 mm 棋盘格的眼在手上手眼标定节点。
# 棋盘格为 9 x 13 个完整方格，对应 OpenCV 的 8 x 12 个内角点。
# output_file 是新结果文件，不会覆盖原有 transform.yaml。
hand_eye_calibration:
  ros__parameters:
    image_topic: /depth_cam/rgb/image_raw
    camera_info_topic: /depth_cam/rgb/camera_info
    get_pose_service: /kinematics/get_current_pose
    set_pose_service: /kinematics/set_pose_target
    output_file: /home/ubuntu/ros2_ws/src/app/config/hand_eye_result.yaml
    sample_dir: /home/ubuntu/ros2_ws/src/app/config/hand_eye_samples
    board_squares_x: 9
    board_squares_y: 13
    square_size_m: 0.03
    minimum_samples: 12
    target_samples: 20
    settle_time_s: 2.0
    max_image_age_s: 0.5
    max_single_view_error_px: 4.0
    duplicate_translation_m: 0.004
    duplicate_rotation_deg: 2.0
    ik_duration_s: 1.0
    ik_pitch_range_deg: 6.0
    ik_resolution_deg: 1.0
    publish_debug_image: true
    method: TSAI
    # 每四个值为 x(m), y(m), z(m), pitch(deg)。自动采集前先在仿真中确认这些目标点安全且能看全标定板。
    auto_pose_list: [
      0.19, -0.08, 0.22, -82.0,
      0.21, -0.08, 0.22, -90.0,
      0.23, -0.08, 0.22, -98.0,
      0.19,  0.00, 0.20, -82.0,
      0.21,  0.00, 0.20, -90.0,
      0.23,  0.00, 0.20, -98.0,
      0.19,  0.08, 0.22, -82.0,
      0.21,  0.08, 0.22, -90.0,
      0.23,  0.08, 0.22, -98.0,
      0.19, -0.06, 0.27, -88.0,
      0.23, -0.06, 0.27, -96.0,
      0.19,  0.06, 0.27, -88.0,
      0.23,  0.06, 0.27, -96.0
    ]
